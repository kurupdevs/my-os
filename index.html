.widget{background:rgba(255,255,255,.55);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.75);border-radius:20px;padding:14px 16px;color:#1c1c22;position:relative;box-shadow:0 12px 32px rgba(40,55,100,.18);animation:wgIn .5s cubic-bezier(.3,1.3,.4,1)}@keyframes wgIn{from{opacity:0;transform:translateX(20px)}}
.widget .wx{position:absolute;top:5px;right:7px;background:none;border:0;color:#777;cursor:pointer;font-size:13px;padding:2px 5px}
.widget .wx:hover{color:#fff}
.wg-clock{font-size:44px;font-weight:200;letter-spacing:2px;color:#141726}
.wg-date{color:#9aa;font-size:12.5px;margin-top:2px}
.wg-mtitle{font-weight:600;font-size:13.5px;margin-bottom:8px;text-align:center}
.wg-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11.5px}
.wg-dow{color:#888;font-size:10px}
.wg-day{padding:3px 0;border-radius:6px}
.wg-day.today{background:var(--accent);color:#fff;font-weight:700}
.wg-wx{display:flex;gap:10px;align-items:center}
/* ---------- notes ---------- */
.noteswrap{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;overflow-y:auto;align-content:start}
.note{background:#fff9c4;color:#333;border-radius:4px 4px 12px 4px;padding:10px;min-height:120px;position:relative;box-shadow:0 4px 10px rgba(0,0,0,.25);font-size:13px}
.note .nt{font-weight:700;margin-bottom:6px;outline:none}
.note .nb{outline:none;min-height:70px}
.note .nx{position:absolute;top:4px;right:6px;background:none;border:0;color:#999;cursor:pointer;font-size:14px}
.note .nx:hover{color:#c00}
.noteadd{border:2px dashed rgba(255,255,255,.25);background:transparent;color:#aaa;border-radius:10px;min-height:120px;font-size:15px;cursor:pointer;font-family:inherit}
.noteadd:hover{border-color:var(--accent);color:#fff}

/* ---------- kurubeats ---------- */
.kbwrap{position:relative;padding:20px 20px 16px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;height:100%;background:#0b0b12;color:#fff}
.kbbg{position:absolute;inset:-50px;background-size:cover;background-position:center;filter:blur(70px) saturate(1.5);opacity:.32;pointer-events:none}
.kbwrap>*{position:relative;z-index:1}
.kbbrand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:2.5px;color:#ffb3ba}
.kbk{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#ff6b78,#c93a48);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;letter-spacing:0}
.kbtag{margin-left:auto;font-size:10px;letter-spacing:1px;color:#8b8ba3;border:1px solid rgba(255,255,255,.14);padding:3px 8px;border-radius:20px;font-weight:600}
.kbhero{position:relative;width:208px;height:208px;margin:2px auto 0;flex:none}
.kbring{position:absolute;inset:-10px;border-radius:30px;background:conic-gradient(from 0deg,#ED5564,#ffb36b,#b388ff,#ff6b78,#ED5564);filter:blur(16px);opacity:0;transition:opacity .6s}
.kbhero.on .kbring{opacity:.8;animation:kbspin 6s linear infinite}
@keyframes kbspin{to{transform:rotate(360deg)}}
.kbart{position:relative;width:208px;height:208px;border-radius:24px;object-fit:cover;display:block;box-shadow:0 20px 55px rgba(0,0,0,.65);background:#14141f}
.kbhero.on .kbart{animation:kbfloat 4.5s ease-in-out infinite}
@keyframes kbfloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.015)}}
.kbinfo{text-align:center;margin-top:2px}
.kbtitle{font-weight:800;font-size:21px;letter-spacing:.2px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.kbart2{color:#ff8d97;font-weight:600;font-size:13px;margin-top:3px}
.kbviz{width:100%;height:54px;display:block}
.kbseek{display:flex;align-items:center;gap:10px;font-size:11.5px;color:#9a9ab0;font-variant-numeric:tabular-nums}
.kbseek input[type=range],.kbvol input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:linear-gradient(90deg,#ED5564 var(--p,0%),rgba(255,255,255,.14) var(--p,0%));outline:none;cursor:pointer}
.kbseek input[type=range]{flex:1}
.kbseek input[type=range]::-webkit-slider-thumb,.kbvol input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(237,85,100,.35),0 2px 8px rgba(0,0,0,.5);cursor:pointer}
.kbseek input[type=range]::-moz-range-thumb,.kbvol input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(237,85,100,.35);cursor:pointer}
.kbctrl{display:flex;align-items:center;justify-content:center;gap:8px}
.kbbtn{border:none;cursor:pointer;color:#fff;transition:transform .12s,background .15s,box-shadow .2s;font-family:inherit}
.kbbtn.ghost{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.07);font-size:15px}
.kbbtn.ghost:hover{background:rgba(237,85,100,.4)}
.kbbtn.ghost.sm{width:42px;height:42px;font-size:11.5px;font-weight:800;letter-spacing:.3px}
.kbbtn:active{transform:scale(.9)}
.kbplay{width:68px;height:68px;border-radius:50%;font-size:25px;background:linear-gradient(135deg,#ff7580,#ED5564 55%,#c93a48);box-shadow:0 10px 30px rgba(237,85,100,.55);margin:0 10px;display:flex;align-items:center;justify-content:center}
.kbplay:hover{box-shadow:0 10px 38px rgba(237,85,100,.8);transform:scale(1.05)}
.kbvol{display:flex;align-items:center;gap:10px;color:#9a9ab0;font-size:14px;padding:0 2px}
.kbvol input[type=range]{flex:1;--p:80%}
.kbplist{display:flex;flex-direction:column;gap:8px}
.kbtrack{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);cursor:pointer;transition:background .15s,border-color .15s,transform .12s}
.kbtrack:hover{background:rgba(255,255,255,.1);transform:translateX(3px)}
.kbtrack.on{border-color:rgba(237,85,100,.65);background:rgba(237,85,100,.1)}
.kbtrack img{width:46px;height:46px;border-radius:11px;object-fit:cover;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.kbtrack .kbt{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbtrack .kba{font-size:12px;color:#9a9ab0}
.kbeq{display:flex;align-items:flex-end;gap:2.5px;height:18px;margin-left:auto;flex:none}
.kbeq i{width:3px;border-radius:2px;background:linear-gradient(180deg,#ff8d97,#ED5564);height:25%}
.kbtrack.on.playing .kbeq i{animation:kbeqb .9s ease-in-out infinite}
.kbtrack.on.playing .kbeq i:nth-child(2){animation-delay:.15s}
.kbtrack.on.playing .kbeq i:nth-child(3){animation-delay:.3s}
.kbtrack.on.playing .kbeq i:nth-child(4){animation-delay:.45s}
@keyframes kbeqb{0%,100%{height:22%}50%{height:100%}}
.kbfoot{margin-top:2px}
.kbdl{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;background:rgba(125,216,125,.07);border:1px solid rgba(125,216,125,.22);color:#7dd87d;text-decoration:none;font-size:13px;font-weight:700;transition:background .15s}
.kbdl:hover{background:rgba(125,216,125,.15)}
/* ---------- radio ---------- */
.radiowrap{padding:18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.rnow{display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.25);border-radius:14px;padding:14px}
.rplay{width:54px;height:54px;border-radius:50%;background:var(--accent);border:0;color:#fff;font-size:22px;cursor:pointer;flex:none}
.rstation{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:10px 14px;cursor:pointer;color:#dfe3f2;font-size:14px;text-align:left;width:100%;font-family:inherit}
.rstation:hover{background:rgba(255,255,255,.1)}
.rstation.on{border-color:var(--accent);background:rgba(255,255,255,.09)}
.rstation .dot{width:10px;height:10px;border-radius:50%;background:#555;flex:none}
.rstation.on .dot{background:#4caf50;box-shadow:0 0 8px #4caf50}
/* ---------- image viewer ---------- */
.ivwrap{display:flex;flex-direction:column;height:100%}
.ivmain{flex:1;background-size:contain;background-position:center;background-repeat:no-repeat;background-color:#0a0a0e;position:relative;min-height:0}
.ivbar{flex:none;display:flex;gap:8px;align-items:center;padding:10px;background:rgba(0,0,0,.35);overflow-x:auto}
.ivthumb{width:76px;height:48px;border-radius:6px;background-size:cover;background-position:center;border:2px solid transparent;cursor:pointer;flex:none;padding:0}
.ivthumb.on{border-color:var(--accent)}
.ivnav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);border:0;color:#fff;font-size:24px;width:44px;height:64px;border-radius:10px;cursor:pointer}
/* ---------- files ---------- */
.files{display:flex;height:100%}
.files .side{width:176px;flex:0 0 176px;background:#333;padding:8px 6px;font-size:13.5px;overflow:auto}
.files .side .srow{padding:8px 12px;border-radius:8px;cursor:pointer;color:#d5d5d5;display:flex;gap:9px;align-items:center;transition:background .12s}
.files .side .srow:hover{background:rgba(255,255,255,.07)}
.files .side .srow.on{background:var(--accent);color:#fff}
.files .main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#2d2d2d}
.files .toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#383838;border-bottom:1px solid #1b1b1b}
.files .toolbar button{background:#4a4a4a;border:0;color:#eee;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:background .12s}
.files .toolbar button:hover{background:#5d5d5d}
.files .toolbar input{margin-left:auto;background:#1e1e1e;border:1px solid #4a4a4a;color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;outline:0;width:170px;-webkit-user-select:text;user-select:text}
.files .crumb{font-size:12.5px;color:#aaa;padding:9px 14px 0}
.files .crumb span{cursor:pointer}.files .crumb span:hover{color:#fff}
.files .fgrid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,92px);gap:8px;padding:12px 14px;overflow:auto;align-content:start}
.files .flist{flex:1;overflow:auto;padding:6px 14px}
.ffolder{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:10px 4px;border-radius:10px;font-size:12.5px;color:#ddd;text-align:center;transition:background .12s,transform .12s}
.ffolder:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
.ffolder .fic{font-size:36px;line-height:1}
.ffolder img.thumb{width:66px;height:50px;object-fit:cover;border-radius:6px;border:1px solid #555}
.filerow2{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13.5px;color:#ddd;cursor:pointer;transition:background .12s}
.filerow2:hover{background:rgba(255,255,255,.07)}
.filerow2 .sz{margin-left:auto;color:#999;font-size:12px}
.viewer{background:#0a0a10;display:flex;align-items:center;justify-content:center;height:100%}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
/* ---------- chrome ---------- */
.chrome{display:flex;flex-direction:column;height:100%;background:#2d2d2d}
.chrome .tabs{display:flex;align-items:flex-end;gap:4px;padding:8px 8px 0;background:#1e1e1e;overflow-x:auto}
.chrome .tab{display:flex;align-items:center;gap:8px;background:#333;color:#bbb;font-size:12.5px;padding:8px 10px 8px 14px;border-radius:9px 9px 0 0;cursor:pointer;max-width:190px;min-width:120px;transition:background .12s}
.chrome .tab.on{background:#2d2d2d;color:#fff}
.chrome .tab .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrome .tab .x{border:0;background:transparent;color:#999;cursor:pointer;font-size:13px;border-radius:5px;width:20px;height:20px}
.chrome .tab .x:hover{background:rgba(255,255,255,.15);color:#fff}
.chrome .newtab{border:0;background:transparent;color:#999;font-size:18px;cursor:pointer;width:32px;height:32px;border-radius:8px}
.chrome .newtab:hover{background:rgba(255,255,255,.1);color:#fff}
.chrome .navbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#2d2d2d}
.chrome .nbtn{border:0;background:transparent;color:#ccc;font-size:16px;cursor:pointer;width:32px;height:32px;border-radius:8px;transition:background .12s}
.chrome .nbtn:hover:not(:disabled){background:rgba(255,255,255,.1)}
.chrome .nbtn:disabled{opacity:.3;cursor:default}
.chrome .addr{flex:1;display:flex;background:#1e1e1e;border:1px solid #4a4a4a;border-radius:20px;padding:0 6px 0 14px;align-items:center;transition:border-color .15s}
.chrome .addr:focus-within{border-color:var(--accent)}
.chrome .addr input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:13px;padding:8px 0;-webkit-user-select:text;user-select:text}
.chrome .addr button{border:0;background:transparent;color:#999;cursor:pointer;font-size:14px;padding:6px 8px;border-radius:12px}
.chrome .addr button:hover{color:#fff}
.chrome .bookmarks{display:flex;gap:4px;padding:6px 12px;background:#2d2d2d;border-bottom:1px solid #1e1e1e}
.chrome .bookmarks button{background:transparent;border:0;color:#aaa;font-size:12px;padding:5px 11px;border-radius:14px;cursor:pointer;transition:background .12s}
.chrome .bookmarks button:hover{background:rgba(255,255,255,.09);color:#fff}
.chrome .view{flex:1;position:relative;background:#fff}
.chrome .view iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.chrome .blocked{position:absolute;inset:0;background:rgba(244,246,251,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#5a5f78}
/* ---------- gnome settings ---------- */
.gset{display:flex;height:100%;background:#2d2d2d}
.gset .gside{width:210px;flex:0 0 210px;background:#383838;padding:10px 8px;overflow:auto}
.gset .gside .srow{padding:10px 14px;border-radius:9px;cursor:pointer;font-size:14px;color:#ddd;display:flex;gap:11px;align-items:center;transition:background .12s}
.gset .gside .srow:hover{background:rgba(255,255,255,.07)}
.gset .gside .srow.on{background:var(--accent);color:#fff}
.gset .gmain{flex:1;padding:24px 30px;overflow:auto}
.gset h2{font-size:20px;color:#fff;margin-bottom:18px;font-weight:600}
.gcard{background:#383838;border-radius:12px;padding:6px 0;margin-bottom:16px;overflow:hidden}
.grow{display:flex;align-items:center;gap:13px;padding:13px 18px;font-size:14px;color:#eee;cursor:pointer;transition:background .12s}
.grow:hover{background:rgba(255,255,255,.05)}
.grow .sub{color:#999;font-size:12.5px;display:block;margin-top:2px}
.grow .tg{margin-left:auto;width:46px;height:26px;border-radius:13px;background:#5a5a5a;position:relative;transition:background .2s;flex:0 0 auto}
.grow .tg.on{background:var(--accent)}
.grow .tg:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.grow .tg.on:after{left:23px}
.grow input[type=range]{margin-left:auto;accent-color:var(--accent);width:190px}
.wpicks{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.wpick{border-radius:12px;overflow:hidden;cursor:pointer;border:3px solid transparent;transition:border-color .15s,transform .15s;position:relative;height:120px;background-size:cover;background-position:center}
.wpick:hover{transform:scale(1.03)}
.wpick.on{border-color:var(--accent)}
.wpick span{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:5px 10px}
.swatches{display:flex;gap:13px;margin-top:6px}
.sw{width:46px;height:46px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s,border-color .15s}
.sw:hover{transform:scale(1.12)}
.sw.on{border-color:#fff}
.netrow{display:flex;align-items:center;gap:12px;padding:12px 18px;font-size:14px;color:#eee;border-top:1px solid #2d2d2d;cursor:pointer}
.netrow:hover{background:rgba(255,255,255,.05)}
.netrow .st{margin-left:auto;color:#999;font-size:12.5px}
/* ---------- generic app ---------- */
.app{padding:20px;font-size:14px;height:100%;overflow:auto;background:#2d2d2d}
.app h2{font-size:18px;margin-bottom:12px;color:#fff}
.bigbtn{background:var(--accent);border:0;color:#fff;padding:9px 22px;border-radius:8px;font-size:14px;cursor:pointer;margin-top:14px;transition:filter .12s,transform .12s}
.officelaunch{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:20px;box-sizing:border-box}
.ol-icon{width:84px;height:84px;border-radius:18px;color:#fff;font-size:44px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;margin-bottom:14px;box-shadow:0 6px 18px rgba(0,0,0,.35)}

.ol-sub{opacity:.65;font-size:13px;line-height:1.6;margin-bottom:6px}

.ty-stats b{color:var(--accent)}
.ty-text{background:rgba(255,255,255,.06);border-radius:10px;padding:14px;font-size:16px;line-height:1.9;min-height:110px;font-family:Georgia,serif}
.ty-text .ok{color:#7dd87d}.ty-text .bad{color:#ff6b6b;background:rgba(255,60,60,.15);border-radius:3px}.ty-text .cur{background:rgba(255,255,255,.18);border-radius:3px}
.ty-input{flex:1;min-height:60px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;color:inherit;font-size:15px;padding:12px;resize:none;font-family:inherit}
.ty-input:focus{outline:none;border-color:var(--accent)}
.paint{padding:10px;box-sizing:border-box;height:100%;display:flex;flex-direction:column;gap:8px}
.pt-tools{display:flex;gap:10px;align-items:center}
.pt-tools button{background:rgba(255,255,255,.1);border:0;color:inherit;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.pt-tools button.on{background:var(--accent);color:#fff}
#ptCanvas{background:#fff;border-radius:10px;cursor:crosshair;touch-action:none;max-width:100%}
.bigbtn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.bigbtn.ghost{background:#4a4a4a}
.snap{background:#383838;border:1px solid #4a4a4a;border-radius:10px;padding:11px 15px;margin:8px 0;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.calc{padding:16px;height:100%;display:flex;flex-direction:column;gap:10px;background:#2d2d2d}
.calc .disp{background:#1e1e1e;border-radius:10px;padding:16px;text-align:right;font-size:30px;color:#fff;min-height:70px;overflow:hidden;font-family:monospace}
.calc .disp .sub{font-size:13px;color:#999;min-height:18px}
.calc .keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc button{border:0;border-radius:10px;background:#3d3d3d;color:#fff;font-size:19px;cursor:pointer;transition:background .1s,transform .1s}
.calc button:hover{background:#4d4d4d}
.calc button:active{transform:scale(.94)}
.calc button.op{background:#545454}.calc button.eq{background:var(--accent)}
.editor{display:flex;flex-direction:column;height:100%}
.editor .ebar{display:flex;gap:8px;padding:9px;background:#383838}
.editor textarea{flex:1;background:#1e1e1e;color:#fff;border:0;outline:0;padding:12px;font-family:monospace;font-size:14px;resize:none;-webkit-user-select:text;user-select:text}

/* github client */
.gh{display:block;padding:18px;max-width:720px;margin:0 auto}
.ghsearch{display:flex;gap:8px;margin-bottom:16px}
.ghsearch input{flex:1;background:#20232f;border:1px solid #3a3d55;color:#fff;padding:10px 14px;border-radius:10px;outline:0;font-size:14px}
.ghsearch input:focus{border-color:#e8590c}
.ghprofile{display:flex;gap:16px;align-items:center;background:#262a3d;border:1px solid #343850;border-radius:16px;padding:18px;animation:ghIn .5s ease both}
.ghprofile img{width:84px;height:84px;border-radius:50%;border:3px solid #e8590c;flex:none}
.ghprofile .nm{font-size:22px;font-weight:700}
.ghprofile .un{color:#8b90a7;font-size:14px}
.ghprofile .bio{color:#c6cadd;margin-top:6px;font-size:14px}
.ghprofile .loc{color:#8b90a7;font-size:13px;margin-top:4px}
.ghstats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.ghstat{flex:1;min-width:110px;background:#262a3d;border:1px solid #343850;border-radius:12px;padding:12px;text-align:center;animation:ghIn .5s ease both}
.ghstat b{font-size:20px;display:block}
.ghstat span{color:#8b90a7;font-size:12px}
.ghrepos{margin-top:14px;display:grid;gap:10px}
.ghrepo{background:#262a3d;border:1px solid #343850;border-radius:12px;padding:12px 14px;cursor:pointer;animation:ghIn .45s ease both;transition:transform .15s,border-color .15s}
.ghrepo:hover{transform:translateY(-2px);border-color:#e8590c}
.ghrepo .rn{font-weight:700;color:#7aa2f7;font-size:15px}
.ghrepo .rd{color:#a7abc0;font-size:13px;margin:4px 0}
.ghrepo .rm{color:#8b90a7;font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
.ghrepo .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.gherr{text-align:center;color:#ff8787;padding:34px 10px;font-size:14px}
.skel{background:linear-gradient(90deg,#2b2e45 25%,#3a3e5c 50%,#2b2e45 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:8px;min-height:16px}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes ghIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

 e.textContent=p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
 const de=$('#wgDate');if(de)de.textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});}
setInterval(tickWgClock,1000);
const WXMAP=[[95,'⛈','Storm'],[80,'🌦','Showers'],[71,'🌨','Snow'],[61,'🌧','Rain'],[51,'🌦','Drizzle'],[45,'🌫','Foggy'],[3,'☁','Overcast'],[2,'⛅','Partly cloudy'],[1,'🌤','Mostly clear'],[0,'☀','Clear sky']];
async function loadWeather(){const e=$('#wgWx');if(!e)return;
 try{const r=await (await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.05&longitude=-118.25&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=auto')).json();
  const code=r.current.weather_code;let ic='🌡',lb='—';
  for(const w of WXMAP)if(code>=w[0]){ic=w[1];lb=w[2];break;}
  e.innerHTML='<div style="font-size:32px">'+ic+'</div><div><b style="font-size:20px">'+Math.round(r.current.temperature_2m)+'°F</b><div class="dim" style="font-size:12px">'+lb+' · Los Angeles</div></div>';
 }catch(err){e.innerHTML='<span class="dim">Weather offline</span>';}}

const NOTES=[{t:'Welcome',c:'Click any text to edit. Your notes live here.'},{t:'Ideas',c:'Ship something today.'}];
function openNotes(){
 const W=openWin('notes','Notes','<div class="noteswrap" id="ntWrap"></div>',640,440);
 const w=W.el.querySelector('#ntWrap');
 function draw(){w.innerHTML='';
  NOTES.forEach((n,i)=>{const d=document.createElement('div');d.className='note';
   d.innerHTML='<button class="nx" title="Delete">✕</button><div class="nt" contenteditable="true" spellcheck="false">'+esc(n.t)+'</div><div class="nb" contenteditable="true" spellcheck="false">'+esc(n.c)+'</div>';
   d.querySelector('.nx').onclick=()=>{NOTES.splice(i,1);draw();};
   d.querySelector('.nt').oninput=e=>{n.t=e.target.textContent;};
   d.querySelector('.nb').oninput=e=>{n.c=e.target.textContent;};
   w.appendChild(d);});
  const a=document.createElement('button');a.className='noteadd';a.textContent='+ New note';
  a.onclick=()=>{NOTES.push({t:'Untitled',c:''});draw();};w.appendChild(a);}
 draw();}

function openKuruBeats(){
 const W=openWin('kurubeats','KuruBeats','<div class="kbwrap">'
 +'<div class="kbbg" id="kbBg"></div>'
 +'<div class="kbbrand"><span class="kbk">K</span>KURUBEATS<span class="kbtag">LOCAL</span></div>'
 +'<div class="kbhero" id="kbHero"><div class="kbring"></div><img class="kbart" id="kbArt" src="'+KB_ART+'"></div>'
 +'<div class="kbinfo"><div class="kbtitle" id="kbTitle"></div><div class="kbart2" id="kbArtist"></div></div>'
 +'<canvas class="kbviz" id="kbViz"></canvas>'
 +'<div class="kbseek"><span id="kbCur">0:00</span><input type="range" id="kbSeek" min="0" max="1000" value="0"><span id="kbDur">0:00</span></div>'
 +'<div class="kbctrl"><button class="kbbtn ghost" id="kbPrev" title="Previous">&#9198;</button><button class="kbbtn ghost sm" id="kbBack" title="Back 10 seconds">&minus;10</button><button class="kbbtn kbplay" id="kbPlay">&#9654;</button><button class="kbbtn ghost sm" id="kbFwd" title="Forward 10 seconds">+10</button><button class="kbbtn ghost" id="kbNext" title="Next">&#9197;</button></div>'
 +'<div class="kbvol">&#128266;<input type="range" id="kbVol" min="0" max="100" value="80"></div>'
 +'<div class="kbplist" id="kbList"></div>'
 +'<div class="kbfoot"><a class="kbdl" id="kbDl" target="_blank" href="https://github.com/kurupdevs/KuruBeats/releases/download/v15.1.6/KuruBeats-15.1.6-release.apk">&#8681; Get KuruBeats for Android (v15.1.6 APK)</a></div>'
 +'</div>',600,680);
 const au=new Audio();au.preload='auto';au.volume=0.8;
 let cur=0,playing=false,raf=null,actx=null,analyser=null,dataArr=null;
 const art=W.el.querySelector('#kbArt'),title=W.el.querySelector('#kbTitle'),artist=W.el.querySelector('#kbArtist'),
   play=W.el.querySelector('#kbPlay'),seek=W.el.querySelector('#kbSeek'),tcur=W.el.querySelector('#kbCur'),tdur=W.el.querySelector('#kbDur'),
   cv=W.el.querySelector('#kbViz'),ctx=cv.getContext('2d'),list=W.el.querySelector('#kbList'),
   hero=W.el.querySelector('#kbHero');
 W.el.querySelector('#kbBg').style.backgroundImage='url('+KB_ART+')';
 function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
 function doPlay(){try{const pr=au.play();if(pr&&pr.then)pr.then(()=>setPlaying(true)).catch(()=>{});else setPlaying(true);}catch(e){}}
 function ensureViz(){if(actx||!window.AudioContext)return;try{actx=new AudioContext();const src=actx.createMediaElementSource(au);analyser=actx.createAnalyser();analyser.fftSize=128;analyser.smoothingTimeConstant=0.82;src.connect(analyser);analyser.connect(actx.destination);dataArr=new Uint8Array(analyser.frequencyBinCount);}catch(e){actx=null;}}
 function sizeCv(){const r=cv.getBoundingClientRect();cv.width=Math.max(50,r.width);cv.height=Math.max(20,r.height);}
 function drawViz(t){if(!ctx)return;sizeCv();const w=cv.width,h=cv.height;ctx.clearRect(0,0,w,h);
  const n=48,bw=w/n;let vals=null;
  if(analyser&&dataArr){analyser.getByteFrequencyData(dataArr);vals=dataArr;}
  for(let i=0;i<n;i++){let v;
   if(vals){v=vals[Math.floor(i/n*vals.length*0.75)]/255;}
   else{v=0.25+0.35*Math.abs(Math.sin(t/420+i*0.55))+0.2*Math.abs(Math.sin(t/900+i*1.3));}
   const bh=Math.max(3,v*(h-6));const x=i*bw+1;
   const g=ctx.createLinearGradient(0,h-bh,0,h);g.addColorStop(0,'#ff6b78');g.addColorStop(1,'#ED5564');
   ctx.fillStyle=g;if(ctx.roundRect){ctx.beginPath();ctx.roundRect(x,h-bh,bw-2,bh,2);ctx.fill();}else{ctx.fillRect(x,h-bh,bw-2,bh);}}
  if(playing)raf=requestAnimationFrame(drawViz);}
 function load(i){cur=((i%KB_TRACKS.length)+KB_TRACKS.length)%KB_TRACKS.length;const t=KB_TRACKS[cur];
  au.src=t.src;title.textContent=t.title;artist.textContent=t.artist;tdur.textContent=fmt(t.dur);tcur.textContent='0:00';seek.value=0;seekFill();
  [...list.children].forEach((b,j)=>b.classList.toggle('on',j===cur));}
 function setPlaying(p){playing=p;play.innerHTML=p?'&#10074;&#10074;':'&#9654;';hero.classList.toggle('on',p);
  [...list.children].forEach((b,j)=>b.classList.toggle('playing',p&&j===cur));
  if(p){ensureViz();if(actx&&actx.state==='suspended')actx.resume();cancelAnimationFrame(raf);raf=requestAnimationFrame(drawViz);}
  else{cancelAnimationFrame(raf);raf=null;drawViz(0);}}
 function toggle(){if(au.paused){doPlay();}else{au.pause();setPlaying(false);}}
 KB_TRACKS.forEach((t,i)=>{const b=document.createElement('div');b.className='kbtrack';
  b.innerHTML='<img src="'+KB_ART+'"><div style="min-width:0;flex:1"><div class="kbt">'+t.title+'</div><div class="kba">'+t.artist+' &middot; '+fmt(t.dur)+'</div></div><span class="kbeq"><i></i><i></i><i></i><i></i></span>';
  b.onclick=()=>{if(cur===i&&au.src){toggle();return;}load(i);doPlay();};
  list.appendChild(b);});
 play.onclick=toggle;
 W.el.querySelector('#kbPrev').onclick=()=>{load(cur-1);doPlay();};
 W.el.querySelector('#kbNext').onclick=()=>{load(cur+1);doPlay();};
 W.el.querySelector('#kbBack').onclick=()=>{au.currentTime=Math.max(0,(au.currentTime||0)-10);};
 W.el.querySelector('#kbFwd').onclick=()=>{const d=au.duration||KB_TRACKS[cur].dur;au.currentTime=Math.min(d,(au.currentTime||0)+10);};
 W.el.querySelector('#kbVol').oninput=e=>{au.volume=e.target.value/100;e.target.style.setProperty('--p',e.target.value+'%');};
 function seekFill(){seek.style.setProperty('--p',(seek.value/10)+'%');}
 seek.addEventListener('input',()=>{const d=au.duration||KB_TRACKS[cur].dur;if(d)au.currentTime=seek.value/1000*d;seekFill();});
 au.ontimeupdate=()=>{const d=au.duration||KB_TRACKS[cur].dur;if(d){seek.value=(au.currentTime/d*1000)||0;seekFill();tcur.textContent=fmt(au.currentTime);}};
 au.onloadedmetadata=()=>{tdur.textContent=fmt(au.duration);};
 au.onended=()=>{setPlaying(false);};
 au.onpause=()=>{if(playing)setPlaying(false);};
 W.el.querySelector('#kbDl').onclick=e=>{e.preventDefault();try{window.open('https://github.com/kurupdevs/KuruBeats/releases/download/v15.1.6/KuruBeats-15.1.6-release.apk','_blank');}catch(err){}};
 W.el.querySelector('[data-a=close]').addEventListener('click',()=>{try{au.pause();}catch(e){}cancelAnimationFrame(raf);if(actx){try{actx.close();}catch(e){}}});
 load(0);drawViz(0);setTimeout(sizeCv,50);
}

 function upd(){play.textContent=playing?'⏸':'▶';

  if(cur>=0){nm.textContent=STATIONS[cur][0];ds.textContent=STATIONS[cur][2]+' · live';}}
 play.onclick=()=>{if(cur<0){list.children[0].click();return;}playing=!playing;if(playing)au.play();else au.pause();upd();};
 W.el.querySelector('#rVol').oninput=e=>{au.volume=e.target.value/100;};

/* ============ CALCULATOR ============ */
function openCalc(){
  const W=openWin('calc','Calculator','<div class="calc"><div class="disp"><div class="sub" id="cSub"></div><div id="cOut">0</div></div><div class="keys" id="cKeys"></div></div>',320,460);
  const out=W.el.querySelector('#cOut'),sub=W.el.querySelector('#cSub');
  let cur='0',prev=null,op=null,fresh=true;
  const keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='];
  const ke=W.el.querySelector('#cKeys');
  keys.forEach(k=>{const b=document.createElement('button');b.textContent=k;
    if('÷×−+='.includes(k))b.className='op';if(k==='=')b.className='eq';b.onclick=()=>press(k);ke.appendChild(b);});
  function press(k){
    if(/\d/.test(k)){cur=fresh?k:(cur==='0'?k:cur+k).slice(0,14);fresh=false}
    else if(k==='.'){if(fresh){cur='0.';fresh=false}else if(!cur.includes('.'))cur+='.'}
    else if(k==='C'){cur='0';prev=null;op=null;fresh=true;sub.textContent=''}
    else if(k==='⌫'){cur=cur.length>1?cur.slice(0,-1):'0'}
    else if(k==='±'){cur=String(-parseFloat(cur))}
    else if(k==='%'){cur=String(parseFloat(cur)/100)}
    else if(k==='='){if(op&&prev!==null){const r=calc(prev,parseFloat(cur),op);sub.textContent=prev+' '+op+' '+cur+' =';cur=String(+r.toFixed(8));prev=null;op=null;fresh=true}}
    else{if(op&&prev!==null&&!fresh){const r=calc(prev,parseFloat(cur),op);cur=String(+r.toFixed(8));prev=parseFloat(cur)}else prev=parseFloat(cur);
      op=k;fresh=true;sub.textContent=prev+' '+op}
    out.textContent=cur;}
  function calc(a,b,o){return o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:b===0?NaN:a/b}
  W.el.tabIndex=0;W.el.addEventListener('keydown',e=>{
    const m={'*':'×','/':'÷','-':'−','+':'+','Enter':'=','Backspace':'⌫','Escape':'C',',':'.'};
    const k=m[e.key]||e.key;if(keys.includes(k)){press(k);e.preventDefault()}});
}
/* ============ EDITOR ============ */
function openEditor(file){
  const W=openWin('editor','Editor'+(file?' — '+file:''),'<div class="editor"><div class="ebar"><button class="bigbtn" style="margin:0;padding:7px 16px" id="edSave">Save</button><button class="bigbtn ghost" style="margin:0;padding:7px 16px" id="edClear">Limpiar</button></div><textarea id="edText" placeholder="Type here...">'+(file==='notas.txt'?esc(localStorage.getItem('nota')||'Comprar pan\nLlamar a Lexy\n'):'')+'</textarea></div>',560,440);
  W.el.querySelector('#edSave').onclick=()=>{const t=W.el.querySelector('#edText').value;
    try{localStorage.setItem('nota',t)}catch(e){}
    const b=document.createElement('a');b.href='data:text/plain;charset=utf-8,'+encodeURIComponent(t);b.download=(file||'nota')+'.txt';b.click()};
  W.el.querySelector('#edClear').onclick=()=>{W.el.querySelector('#edText').value=''};
}

let snaps=[['2026-09-28 22:14','Manual','4.2 GB'],['2026-09-21 03:00','Automatic','4.0 GB']];
function openTimeshift(){
  const W=openWin('timeshift','Timeshift','<div class="app"><h2>🕘 Timeshift — Snapshots</h2><div id="snapList"></div><button class="bigbtn" id="mkSnap">Create snapshot</button></div>',540,420);
  const list=W.el.querySelector('#snapList');

    list.querySelectorAll('button').forEach(b=>b.onclick=()=>{b.textContent='Restaurando...';b.disabled=true;setTimeout(()=>{b.textContent='Restaurado ✓';setTimeout(render,1200)},1800)})}
  render();
  W.el.querySelector('#mkSnap').onclick=()=>{const n=new Date(),p=x=>String(x).padStart(2,'0');
    snaps.unshift([n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+' '+p(n.getHours())+':'+p(n.getMinutes()),'Manual','4.3 GB']);render()};
}

/* ============ SMARTCLEAN ============ */
const SCNAV=[['mycleaner','⚡','My Cleaner','sec0'],['mail','✉','Mail','Cleanup'],['photo','🖼','Photo','Cleanup'],
 ['video','🎬','Video','Cleanup'],['music2','🎵','Music','Cleanup'],['trash2','🗑','Trash','Cleanup'],
 ['malware','🛡','Malware Removal','Protection'],['privacy','👁','Privacy','Protection'],
 ['diskanalyzer','🔍','Disk Analyzer','Tools'],['duplicates','⧉','Duplicate Finder','Tools'],['maintenance','🔧','Maintenance','Tools']];
let scView='mycleaner', scMem=42, scJunk=3.2;
function openSmartClean(){
  const W=openWin('smartclean','SmartClean','<div class="sc"><div class="side" id="scSide"></div><div class="main" id="scMain"></div><div class="fab" id="scFab" title="Turbo Boost">🚀</div></div>',1040,700);
  renderScNav(W);renderScMain(W);
  W.el.querySelector('#scFab').onclick=()=>turboBoost(W);
}
function renderScNav(W){
  const s=W.el.querySelector('#scSide');let h='<div class="logo"><span class="z">⚡</span> SmartClean</div>',last='';
  SCNAV.forEach(n=>{if(n[3]!==last&&n[3]!=='sec0'){h+='<div class="sec">'+n[3]+'</div>';last=n[3]}
    h+='<div class="nrow'+(scView===n[0]?' on':'')+'" data-v="'+n[0]+'"><span class="ic">'+n[1]+'</span>'+n[2]+'</div>'});
  s.innerHTML=h;
  s.querySelectorAll('.nrow').forEach(r=>r.onclick=()=>{scView=r.dataset.v;renderScNav(W);renderScMain(W)});
}
function scLogBox(id){return '<div class="log" id="'+id+'"></div><div class="resline" id="'+id+'-res"></div>'}
function scRun(view,btn,barSel,logId,steps,done){
  btn.disabled=true;const bar=view.querySelector(barSel),log=view.querySelector('#'+logId),res=view.querySelector('#'+logId+'-res');
  log.innerHTML='';if(res)res.innerHTML='';let i=0;bar.style.width='0';
  const t=setInterval(()=>{
    if(i<steps.length){const s=steps[i];log.innerHTML+='<div>'+esc(s[0])+'</div>';log.scrollTop=log.scrollHeight;
      bar.style.width=((i+1)/steps.length*100)+'%';i++}
    else{clearInterval(t);btn.disabled=false;if(done)done()}},420);
}
function renderScMain(W){
  const m=W.el.querySelector('#scMain');
  if(scView==='mycleaner')return scDashboard(W,m);
  if(['mail','photo','video','music2','trash2'].includes(scView))return scCleanupView(W,m);
  if(scView==='malware')return scMalwareView(W,m);
  if(scView==='privacy')return scPrivacyView(W,m);
  if(scView==='diskanalyzer')return scDiskView(W,m);
  if(scView==='duplicates')return scDupView(W,m);
  if(scView==='maintenance')return scMaintView(W,m);
}
/* ---- dashboard ---- */
function scDashboard(W,m){
  m.innerHTML='<h1>My Cleaner</h1><div class="cards">'+
  card('clean','🖥','Clean Now',['Clean my Pc','Large Files'],'Analizar')+
  card('prot','🛡','Protection',['Scan Virus','Firewall'],'Escanear')+
  card('boost','🚀','Boost My PC',['Scan Unwanted File','Scan cache','Optimize System'],'Optimizar')+
  card('trash','🗑','Trash',['Scan Trash','Temporary Files','Recycle Bin','Log Files'],'Empty')+
  '</div><div class="row2"><div class="panel"><h3>Cleaner</h3><div class="tabs"><span class="on" data-t="win">Windows</span><span data-t="app">Application</span><span data-t="reg">Registry</span></div><div id="scCleanerList"></div><button class="bigclean" id="scCleanGo">Limpiar seleccionados</button></div>'+
  '<div class="panel"><h3>Disk Information</h3><div class="diskrow"><div class="dl"><span>💽 System Disk</span><span>43.8 GB free of 111 GB</span></div><div class="diskbar"><i style="width:60%"></i></div></div><div class="diskrow"><div class="dl"><span>💽 Local Disk</span><span>105 GB free of 465 GB</span></div><div class="diskbar"><i style="width:77%"></i></div></div><div class="resline">Estado de los discos: <b>saludable</b></div></div>'+
  '<div class="panel"><h3>Boost Memory</h3><div class="ringwrap"><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#2c2e48" stroke-width="10"/><circle id="memRing" cx="50" cy="50" r="42" fill="none" stroke="#3f7fe0" stroke-width="10" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="'+(264*(1-scMem/100))+'" transform="rotate(-90 50 50)"/><text id="memTxt" x="50" y="46" text-anchor="middle" fill="#8f94b5" font-size="11">Memory Usage</text><text id="memPct" x="50" y="64" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">'+scMem+' %</text></svg><button class="bigclean" style="width:auto;padding:9px 26px" id="memBoost">Boost Now</button></div></div></div>';
  function card(id,ic,t,subs,btn){return '<div class="card"><div class="ch"><span class="ic">'+ic+'</span>'+t+'</div><div class="cs">'+subs.join('<br>')+'</div><div class="bar"><i id="bar-'+id+'"></i></div><button id="btn-'+id+'">'+btn+'</button></div>'}
  const cleanerData={win:[['Google Chrome',['Internet Cache','Cookies','Download History','Last Download Location','Saved Form Information','Saved Password','Compact Databases']],['Multimedia',['Adobe Flash Player','Windows Media Player']],['Windows Explorer',['Recent Documents','Thumbnail Cache']]],
    app:[['Brave',['Internet Cache','Cookies','Session']],['Spotify',['Cache']],['Quod Libet',['Cache']]],
    reg:[['Registro',['Entradas obsoletas','DLL compartidas','Extensiones de archivo']]]};
  let tab='win';
  const cl=W.el.querySelector('#scCleanerList');
  function renderCleaner(){cl.innerHTML=cleanerData[tab].map((g,gi)=>'<label class="chk"><input type="checkbox" checked data-g="'+gi+'"><b>'+g[0]+'</b></label>'+g[1].map(s=>'<label class="chk"><span class="sub"><input type="checkbox" checked class="sc-sub" data-g="'+gi+'"> '+s+'</span></label>').join('')).join('');
    cl.querySelectorAll('[data-g]').forEach(cb=>{if(!cb.classList.contains('sc-sub'))cb.onchange=()=>{cl.querySelectorAll('.sc-sub[data-g="'+cb.dataset.g+'"]').forEach(x=>x.checked=cb.checked)}})}
  renderCleaner();
  m.querySelectorAll('.tabs span').forEach(t=>t.onclick=()=>{m.querySelectorAll('.tabs span').forEach(x=>x.classList.remove('on'));t.classList.add('on');tab=t.dataset.t;renderCleaner()});
  W.el.querySelector('#scCleanGo').onclick=e=>{const n=cl.querySelectorAll('input:checked').length;e.target.disabled=true;e.target.textContent='Limpiando...';
    setTimeout(()=>{e.target.disabled=false;e.target.textContent='Limpiar seleccionados';scJunk=Math.max(0,scJunk-0.4);const r=document.createElement('div');r.style.cssText='color:#7dd87d;font-size:13px;margin-top:10px';r.textContent='✓ '+n+' items limpiados · '+scJunk.toFixed(1)+' GB de basura restante';e.target.parentNode.appendChild(r);setTimeout(()=>r.remove(),5000)},1400)};
  const steps={clean:[['Analyzing temporary files...'],['Analyzing large files...'],['Calculando espacio...']],
    prot:[['Escaneando virus...'],['Comprobando firewall...'],['Checking definitions...']],
    boost:[['Buscando archivos innecesarios...'],['Analyzing cache...'],['Optimizando sistema...']],
    trash:[['Analyzing trash...'],['Temporary files...'],['Log files...']]};
  ['clean','prot','boost','trash'].forEach(id=>{
    W.el.querySelector('#btn-'+id).onclick=e=>scRun(m,e.target,'#bar-'+id,'scDashLog',steps[id],()=>{
      const msgs={clean:'Cleanup done: <b>'+(0.8+Math.random()).toFixed(1)+' GB</b> recoverable — use Cleaner to clean them',
        prot:'Protection: <b>0 threats</b> · Firewall active',
        boost:'Optimization complete: boot <b>23% faster</b>',
        trash:'Trash: <b>'+trashBin.length+' items</b> ready to empty'};
      let r=m.querySelector('#scDashLog-res');if(!r){const d=document.createElement('div');d.className='resline';d.id='scDashLog-res';m.querySelector('.cards').after(d);r=d}
      r.innerHTML=msgs[id]})});
  if(!m.querySelector('#scDashLog')){const d=document.createElement('div');d.innerHTML=scLogBox('scDashLog');m.querySelector('.cards').after(d.firstChild)}
  W.el.querySelector('#memBoost').onclick=()=>{const ring=W.el.querySelector('#memRing'),txt=W.el.querySelector('#memPct');let v=scMem;
    const t=setInterval(()=>{v-=2;if(v<=26){v=26;clearInterval(t)}ring.style.strokeDashoffset=264*(1-v/100);txt.textContent=v+' %';scMem=v},120)};
}
function turboBoost(W){
  scView='maintenance';const s=W.el.querySelector('#scSide');if(s)renderScNav(W);renderScMain(W);
  setTimeout(()=>{const b=W.el.querySelector('#maintGo');if(b)b.click()},300);
}
/* ---- cleanup views ---- */
const CLEANUP={mail:['Mail','✉',[['Borradores antiguos','12 items','84 MB'],['Duplicate attachments','8 items','210 MB'],['Mail trash','46 items','132 MB']]],
 photo:['Photo','🖼',[['Cache thumbnails','1,240 items','380 MB'],['Duplicate photos','36 items','512 MB'],['Temporary RAW files','5 items','96 MB']]],
 video:['Video','🎬',[['Preview cache','88 items','640 MB'],['Temporary renders','4 items','1.1 GB']]],
 music2:['Music','🎵',[['Cached album art','214 items','96 MB'],['Temp transcodes','11 items','188 MB']]],
 trash2:['Trash','🗑',[['Trash',''+trashBin.length+' items','310 MB'],['Temporary files','1,024 items','890 MB'],['Log files','312 items','145 MB']]]};
function scCleanupView(W,m){
  const c=CLEANUP[scView];
  m.innerHTML='<h1>'+c[1]+' '+c[0]+'</h1><div class="panel"><h3>Analysis of '+c[0].toLowerCase()+'</h3><div class="bar" style="margin:10px 0"><i id="cuBar"></i></div><div id="cuList"></div>'+scLogBox('cuLog')+'<button class="bigclean" id="cuScan">Analizar ahora</button></div>';

  m.querySelector('#cuScan').onclick=e=>{
    scRun(m,e.target,'#cuBar','cuLog',c[2].map(x=>['Analyzing '+x[0].toLowerCase()+'...']),()=>{
      m.querySelector('#cuLog-res').innerHTML='Encontrado: <b>'+c[2].map(x=>x[2]).join(' + ')+'</b>';
      e.target.textContent='Limpiar todo';e.target.onclick=()=>{e.target.disabled=true;e.target.textContent='Limpiando...';
        setTimeout(()=>{list.innerHTML='<div class="resline"><b>✓ Limpio</b> — no queda basura en '+c[0]+'</div>';e.target.textContent='Analizar ahora';e.target.disabled=false;e.target.onclick=null;m.querySelector('#cuScan').onclick=e.target.onclick},1200)}})};
}

}
/* ---- duplicates ---- */
function scDupView(W,m){
  const dups=[['foto-playa (2).jpg','4.2 MB',true],['foto-playa.jpg','4.2 MB',true],['tema-final.mp3','8.1 MB',true],['tema-final-copia.mp3','8.1 MB',false],['notas (1).txt','2 KB',true],['notas.txt','2 KB',false]];

function scMaintView(W,m){
